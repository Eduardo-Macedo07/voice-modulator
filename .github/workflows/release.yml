name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Voice Modulator ${{ github.ref_name }}"
          releaseBody: "Download **voice-modulator_*_x64-setup.exe** below and run it. The installer is not code-signed yet. If SmartScreen warns, click *More info* → *Run anyway*. If Windows 11 Smart App Control blocks it, there is no bypass: turn Smart App Control off, or run the app from source (see the README)."
          releaseDraft: false
          prerelease: false
